<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MysticDao - AI 玄学</title>
  </head>
  <body>
    <script>
      (function() {
        var r = sessionStorage.getItem('__spa_redirect');
        if (r) {
          sessionStorage.removeItem('__spa_redirect');
          if (r.indexOf('#') !== -1) {
            history.replaceState(null, null, r);
          } else {
            history.replaceState(null, null, './#' + r.replace(/^\.?\//, ''));
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
