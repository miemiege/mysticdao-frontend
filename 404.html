<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MysticDao</title>
    <script>
      // GitHub Pages SPA fallback for HashRouter
      var l = window.location;
      var path = l.pathname + l.search + l.hash;
      if (path !== '/' && path !== './' && path !== './index.html') {
        sessionStorage.setItem('__spa_redirect', path);
      }
      l.replace('./');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
